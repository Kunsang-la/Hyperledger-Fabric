---
################################################################################
#
#   Hyperledger Fabric 2.5 Configuration
#
################################################################################

Capabilities:

  Channel: &ChannelCapabilities
    V2_0: true

  Orderer: &OrdererCapabilities
    V2_0: true

  Application: &ApplicationCapabilities
    V2_5: true

################################################################################
# ORGANIZATIONS
################################################################################

Organizations:

  - &OrdererOrg
    Name: OrdererMSP
    ID: OrdererMSP

    MSPDir: ../organizations/ordererOrganizations/example.com/msp

    Policies:

      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"

      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"

      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &Org1

    Name: Org1MSP
    ID: Org1MSP

    MSPDir: ../organizations/peerOrganizations/org1.example.com/msp

    Policies:

      Readers:
        Type: Signature
        Rule: "OR('Org1MSP.admin','Org1MSP.peer','Org1MSP.client')"

      Writers:
        Type: Signature
        Rule: "OR('Org1MSP.admin','Org1MSP.client')"

      Admins:
        Type: Signature
        Rule: "OR('Org1MSP.admin')"

    AnchorPeers:

      - Host: peer0.org1.example.com
        Port: 7051

  - &Org2

    Name: Org2MSP
    ID: Org2MSP

    MSPDir: ../organizations/peerOrganizations/org2.example.com/msp

    Policies:

      Readers:
        Type: Signature
        Rule: "OR('Org2MSP.admin','Org2MSP.peer','Org2MSP.client')"

      Writers:
        Type: Signature
        Rule: "OR('Org2MSP.admin','Org2MSP.client')"

      Admins:
        Type: Signature
        Rule: "OR('Org2MSP.admin')"

    AnchorPeers:

      - Host: peer0.org2.example.com
        Port: 9051

  - &Org3

    Name: Org3MSP
    ID: Org3MSP

    MSPDir: ../organizations/peerOrganizations/org3.example.com/msp

    Policies:

      Readers:
        Type: Signature
        Rule: "OR('Org3MSP.admin','Org3MSP.peer','Org3MSP.client')"

      Writers:
        Type: Signature
        Rule: "OR('Org3MSP.admin','Org3MSP.client')"

      Admins:
        Type: Signature
        Rule: "OR('Org3MSP.admin')"

    AnchorPeers:

      - Host: peer0.org3.example.com
        Port: 11051
################################################################################
# APPLICATION
################################################################################

Application: &ApplicationDefaults

  Organizations:

  Policies:

    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"

    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"

    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"

    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"

  Capabilities:
    <<: *ApplicationCapabilities

################################################################################
# ORDERER
################################################################################

Orderer: &OrdererDefaults

  OrdererType: etcdraft

  Addresses:
    - orderer.example.com:7050

  BatchTimeout: 2s

  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB

  Organizations:

  Policies:

    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"

    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"

    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

  EtcdRaft:

    Consenters:

      - Host: orderer.example.com
        Port: 7050

        ClientTLSCert: ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt

        ServerTLSCert: ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt

  Capabilities:
    <<: *OrdererCapabilities

################################################################################
# CHANNEL
################################################################################

Channel: &ChannelDefaults

  Policies:

    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"

    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"

    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

  Capabilities:
    <<: *ChannelCapabilities
################################################################################
# PROFILES
################################################################################

Profiles:

  ThreeOrgsOrdererGenesis:

    <<: *ChannelDefaults

    Orderer:

      <<: *OrdererDefaults

      Organizations:

        - *OrdererOrg

    Consortiums:

      SampleConsortium:

        Organizations:

          - *Org1
          - *Org2
          - *Org3

  ThreeOrgsApplicationChannel:

    <<: *ChannelDefaults

    Consortium: SampleConsortium

    Application:

      <<: *ApplicationDefaults

      Organizations:

        - *Org1
        - *Org2
        - *Org3

      Capabilities:
        <<: *ApplicationCapabilities
        